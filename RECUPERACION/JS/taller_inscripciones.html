<!DOCTYPE html>
<html lang="es">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Tecnológico – Gestión de Inscripciones</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .formulario {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            margin: 0 auto 30px auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .formulario label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        .formulario input,
        .formulario select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .formulario button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .formulario button:hover {
            background-color: #45a049;
        }

        #btn-modo {
            display: block;
            margin: 0 auto 20px auto;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        #btn-modo:hover {
            background-color: #555;
        }

        #contador {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        table {
            width: 80%;
            margin: 0 auto 30px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        table th {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
        }

        table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .galeria {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .galeria img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🖥️ Taller Tecnológico – Gestión de Inscripciones</h1>

    <!-- Formulario de inscripcion -->
    <div class="formulario">
        <h2>Nueva Inscripción</h2>

        <label for="nombre">Nombre del participante:</label>
        <input type="text" id="nombre" placeholder="Introduce tu nombre">

        <label for="edad">Edad:</label>
        <input type="number" id="edad" placeholder="Introduce tu edad">

        <label for="modalidad">Modalidad:</label>
        <select id="modalidad">
            <option value="">-- Selecciona modalidad --</option>
            <option value="Presencial">Presencial</option>
            <option value="Online">Online</option>
        </select>

        <button id="btn-add">Añadir inscripción</button>
    </div>

    <!-- Contador -->
    <p id="contador">Total inscritos: 0</p>

    <!-- Tabla de inscritos -->
    <table id="tabla-inscritos">
        <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Modalidad</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="cuerpo-tabla">
            <!-- Las filas se añadiran dinamicamente con JavaScript -->
        </tbody>
    </table>

    <!-- Galeria de imagenes del taller -->
    <div class="galeria">
        <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=300" alt="Taller 1">
        <img src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=300" alt="Taller 2">
        <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=300" alt="Taller 3">
    </div>
<script src="examen.js"></script>
</body>
</html>
